services:
  migration-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # Secret used to encrypt saved connection-profile passwords.
      # Change this to a long random string in production (see README.md).
      MIGRATOR_SECRET: ${MIGRATOR_SECRET:-replace-with-a-long-random-secret}
      # Location of the JSON store (profiles + migration history).
      STORE_PATH: /data/store.json
      # Optional: only needed if you want to use the "Engine self-test"
      # button in the UI — point it at ANY throwaway PostgreSQL database.
      # DATABASE_URL: postgresql://user:pass@host:5432/testdb
    volumes:
      # Persist profiles + history across container recreation.
      # Remove this volume (and the entry) if you want them ephemeral.
      - migration_store:/data
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.migration-app.loadbalancer.server.port=3000"

      - "traefik.http.routers.migration-app.rule=Host(`migration.ba101.top`)"
      - "traefik.http.routers.migration-app.entrypoints=websecure"
      - "traefik.http.routers.migration-app.tls=true"
      - "traefik.http.routers.migration-app.tls.certresolver=le"
      - "traefik.http.routers.migration-app.service=migration-app"

      - "traefik.http.routers.migration-app-http.rule=Host(`migration.ba101.top`)"
      - "traefik.http.routers.migration-app-http.entrypoints=web"
      - "traefik.http.routers.migration-app-http.middlewares=migration-app-https"
      - "traefik.http.middlewares.migration-app-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.migration-app-https.redirectscheme.permanent=true"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  migration_store:

networks:
  web:
    external: true
    name: web
