services:
  migration-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: migrator
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${MIGRATOR_DB_PASSWORD:-migration_internal_password_change_me}
    volumes:
      - migration_db_data:/var/lib/postgresql/data
    networks:
      - migration-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d migrator"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  migration-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      migration-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:nije,kikiriki@postgres:5432/migratormigrator
      MIGRATOR_SECRET: ${MIGRATOR_SECRET:-replace-with-a-long-random-secret}
    networks:
      - migration-internal
      - web
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.migration-app.loadbalancer.server.port=3000"

      - "traefik.http.routers.migration-app.rule=Host(`migration.ba101.top`)"
      - "traefik.http.routers.migration-app.entrypoints=websecure"
      - "traefik.http.routers.migration-app.tls=true"
      - "traefik.http.routers.migration-app.tls.certresolver=le"
      - "traefik.http.routers.migration-app.service=migration-app"

      - "traefik.http.routers.migration-app-http.rule=Host(`migration.ba101.top`)"
      - "traefik.http.routers.migration-app-http.entrypoints=web"
      - "traefik.http.routers.migration-app-http.middlewares=migration-app-https"
      - "traefik.http.middlewares.migration-app-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.migration-app-https.redirectscheme.permanent=true"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  migration_db_data:

networks:
  migration-internal:
    internal: true
  web:
    external: true
    name: web
